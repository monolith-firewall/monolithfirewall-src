# Monolith FireWall Preseed Configuration
# For automated Debian installation

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration (DHCP initially, managed by MonolithFireWall after install)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string monolith-firewall
d-i netcfg/get_domain string local

# Mirror configuration for offline installation (use CDROM)
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-double boolean false
# Disable network mirror (offline install)
d-i apt-setup/use_mirror boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string

# Root password (changed during setup wizard)
d-i passwd/root-password password monolith
d-i passwd/root-password-again password monolith

# No additional users (managed by MonolithFireWall)
d-i passwd/make-user boolean false

# Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# Partitioning (use entire disk, single partition)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base system installation
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64

# Package selection
# IMPORTANT:
# Debian netinst ISOs are not full offline repos. Avoid tasksel/pkgsel extras (they require network mirrors).
# We install Monolith + SSH later from /monolith-debs (offline repo) in late_command.
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# Boot loader (supports both BIOS and EFI)
d-i grub-installer/only_debian boolean true
# Auto-detect boot device (works for both BIOS and EFI)
d-i grub-installer/bootdev string default
# For EFI systems, ensure EFI partition is created
d-i partman-efi/non_efi_system boolean false

# Finish installation
d-i finish-install/reboot_in_progress note

# Late command: Copy monolith packages and enable services
# Packages will be installed automatically on first boot
d-i preseed/late_command string \
    echo "=== Monolith FireWall Post-Install ===" > /target/var/log/monolith-install.log; \
    mkdir -p /target/var/lib/monolith-firewall/packages; \
    echo "Created packages directory" >> /target/var/log/monolith-install.log; \
    CDROM_PATH=""; \
    for path in /cdrom /media/cdrom /mnt /run/live/medium; do \
        if [ -d "$path/monolith-packages" ] || [ -d "$path/monolith-debs" ]; then \
            CDROM_PATH="$path"; \
            echo "Found CDROM at: $CDROM_PATH" >> /target/var/log/monolith-install.log; \
            break; \
        fi; \
    done; \
    if [ -n "$CDROM_PATH" ] && [ -d "$CDROM_PATH/monolith-packages" ]; then \
        COPIED=0; \
        for pkg in $CDROM_PATH/monolith-packages/*.mfwpkg; do \
            if [ -f "$pkg" ]; then \
                cp "$pkg" /target/var/lib/monolith-firewall/packages/ && COPIED=$((COPIED+1)); \
                echo "Copied: $(basename $pkg)" >> /target/var/log/monolith-install.log; \
            fi; \
        done; \
        echo "Total packages copied: $COPIED" >> /target/var/log/monolith-install.log; \
    else \
        echo "WARNING: monolith-packages directory not found in any location" >> /target/var/log/monolith-install.log; \
        echo "Searched: /cdrom /media/cdrom /mnt /run/live/medium" >> /target/var/log/monolith-install.log; \
    fi; \
    echo "Installing monolith-firewall from offline repo..." >> /target/var/log/monolith-install.log; \
    mkdir -p /target/var/cache/monolith-debs; \
    if [ -n "$CDROM_PATH" ] && [ -d "$CDROM_PATH/monolith-debs" ]; then \
        cp "$CDROM_PATH/monolith-debs/"* /target/var/cache/monolith-debs/ 2>/dev/null || true; \
        echo "Copied monolith-debs to /var/cache/monolith-debs" >> /target/var/log/monolith-install.log; \
        echo "deb [trusted=yes] file:/var/cache/monolith-debs ./" > /target/etc/apt/sources.list.d/monolith-offline.list; \
        echo "Running apt-get update (CDROM + monolith-offline)..." >> /target/var/log/monolith-install.log; \
        in-target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Languages=none update >> /var/log/monolith-install.log 2>&1' || true; \
        echo "Installing openssh + monolith-firewall (no recommends)..." >> /target/var/log/monolith-install.log; \
        in-target sh -c 'DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Languages=none install -y --no-install-recommends openssh-server openssh-client monolith-firewall >> /var/log/monolith-install.log 2>&1' || true; \
        echo "Done installing monolith-firewall." >> /target/var/log/monolith-install.log; \
    else \
        echo "WARNING: monolith-debs directory not found on CDROM" >> /target/var/log/monolith-install.log; \
    fi; \
    echo "Enabling services..." >> /target/var/log/monolith-install.log; \
    if [ -f /target/lib/systemd/system/monolith-firewall-core.service ]; then \
        in-target systemctl enable monolith-firewall-core.service && echo "Enabled core service" >> /target/var/log/monolith-install.log || echo "Failed to enable core service" >> /target/var/log/monolith-install.log; \
    else \
        echo "SKIP: monolith-firewall-core.service not found (package not installed)" >> /target/var/log/monolith-install.log; \
    fi; \
    if [ -f /target/lib/systemd/system/monolith-firewall-webui.service ]; then \
        in-target systemctl enable monolith-firewall-webui.service && echo "Enabled webui service" >> /target/var/log/monolith-install.log || echo "Failed to enable webui service" >> /target/var/log/monolith-install.log; \
    else \
        echo "SKIP: monolith-firewall-webui.service not found (package not installed)" >> /target/var/log/monolith-install.log; \
    fi; \
    if [ -f /target/lib/systemd/system/monolith-firstboot.service ]; then \
        in-target systemctl enable monolith-firstboot.service && echo "Enabled firstboot service" >> /target/var/log/monolith-install.log || echo "Failed to enable firstboot service" >> /target/var/log/monolith-install.log; \
    else \
        echo "SKIP: monolith-firstboot.service not found (package not installed)" >> /target/var/log/monolith-install.log; \
    fi; \
    touch /target/var/lib/monolith-firewall/.firstboot; \
    echo "Created firstboot flag" >> /target/var/log/monolith-install.log; \
    echo "Configuring SSH for root login..." >> /target/var/log/monolith-install.log; \
    if [ -f /target/etc/ssh/sshd_config ]; then \
        sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /target/etc/ssh/sshd_config; \
        sed -i 's/PermitRootLogin.*/PermitRootLogin yes/' /target/etc/ssh/sshd_config; \
        echo "SSH configured for root login" >> /target/var/log/monolith-install.log; \
    else \
        echo "WARNING: sshd_config not found" >> /target/var/log/monolith-install.log; \
    fi; \
    if [ -f /target/lib/systemd/system/ssh.service ] || [ -f /target/lib/systemd/system/sshd.service ]; then \
        in-target systemctl enable ssh.service >> /target/var/log/monolith-install.log 2>&1 || true; \
        in-target systemctl enable sshd.service >> /target/var/log/monolith-install.log 2>&1 || true; \
        echo "Enabled SSH service" >> /target/var/log/monolith-install.log; \
    fi; \
    echo "=== Post-Install Complete ===" >> /target/var/log/monolith-install.log; \
    true

# Monolith FireWall Preseed Configuration (DEBUG)
#
# This debug preseed runs a late_command helper script that logs aggressively to:
#   /target/var/log/monolith-install.log
#
# It is intended for debugging installer hangs at "Running preseed".

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network configuration (DHCP initially, managed by MonolithFireWall after install)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string monolith-firewall
d-i netcfg/get_domain string local

# Mirror configuration for offline installation (use CDROM)
d-i apt-setup/cdrom/set-first boolean true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-double boolean false
d-i apt-setup/use_mirror boolean false
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string

# Root password (debugging)
d-i passwd/root-password password monolith
d-i passwd/root-password-again password monolith
d-i passwd/make-user boolean false

# Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# Partitioning (use entire disk, single partition)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Base system installation
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64

# Package selection
# IMPORTANT: Avoid tasksel/pkgsel extras on netinst (requires network mirrors).
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i partman-efi/non_efi_system boolean false

# Finish installation
d-i finish-install/reboot_in_progress note

# Late command: run the debug helper script from CDROM
d-i preseed/late_command string \
    /bin/sh -c 'echo "Running monolith-late-debug.sh..." >> /target/var/log/monolith-install.log; /bin/sh /cdrom/monolith-late-debug.sh >> /target/var/log/monolith-install.log 2>&1 || true; echo "monolith-late-debug.sh finished (exit=$?)." >> /target/var/log/monolith-install.log' || true

